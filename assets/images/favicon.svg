<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <!-- Rounded Base (matching navbar logo box) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  
  <!-- Smart Washing Machine / Laundry Drum Graphic -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Drum circle -->
  <circle cx="32" cy="34" r="11" fill="none" stroke="#ffffff" stroke-width="3.5" />
  
  <!-- Water wave inside drum -->
  <path d="M26 35c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0" fill="none" stroke="url(#sparkleGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Control buttons -->
  <circle cx="21" cy="20" r="2.2" fill="#ffffff" />
  <circle cx="29" cy="20" r="2.2" fill="#ffffff" />
  
  <!-- Clean spark -->
  <path d="M41 19l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#38bdf8" />
</svg>
